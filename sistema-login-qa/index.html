<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Login - QA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="brand">
        <div class="logo">QA</div>
        <div>
          <h1>Você é o QA</h1>
          <p>Sistema de demonstração para testes</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-target="login">Entrar</button>
        <button class="tab" data-target="cadastro">Cadastrar</button>
      </div>

      <form id="login" class="form active">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" placeholder="Digite seu e-mail">

        <label for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" placeholder="Digite sua senha">

        <button class="primary" type="submit">Entrar</button>
        <button class="link-button" type="button" id="forgotPassword">Esqueci minha senha</button>
      </form>

      <form id="cadastro" class="form">
        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Digite seu nome">

        <label for="cadEmail">E-mail</label>
        <input id="cadEmail" type="email" placeholder="Digite seu e-mail">

        <label for="cadSenha">Senha</label>
        <input id="cadSenha" type="password" placeholder="Crie uma senha">

        <label for="confirmSenha">Confirmar senha</label>
        <input id="confirmSenha" type="password" placeholder="Confirme sua senha">

        <button class="primary" type="submit">Criar conta</button>
      </form>

      <div id="message" class="message"></div>

      <div class="hint">
        <strong>Conta de demonstração</strong>
        <span>E-mail: aluno@uniandrade.com</span>
        <span>Senha: 123456</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
